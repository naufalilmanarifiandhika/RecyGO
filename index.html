    <script type="text/babel">
        const { useEffect, useRef, useState } = React;

        /* ================================================================== */

        function SvgWrap({ size = 24, className = "", strokeWidth = 2, children, ...props }) {
          return (
            <svg
              width={size}

        const Icons = {

          ScanLine: (p) => <SvgWrap {...p}><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></SvgWrap>,

          Leaf: (p) => <SvgWrap {...p}><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></SvgWrap>,

          Minus: (p) => <SvgWrap {...p}><line x1="5" y1="12" x2="19" y2="12"/></SvgWrap>,

          Ticket: (p) => <SvgWrap {...p}><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></SvgWrap>,
          ShoppingBag: (p) => <SvgWrap {...p}><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></SvgWrap>,
          Smartphone: (p) => <SvgWrap {...p}><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></SvgWrap>,
          Zap: (p) => <SvgWrap {...p}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></SvgWrap>,

            Trash2, Wifi, TrendingUp, X, ChevronLeft, ChevronRight, Check, CheckCircle2,

        } = Icons;

        /* ================================================================== */
        /*  Logo Utama RecyGO (Diperbagus + Tipografi Modern Tanpa 5.0)       */
        /* ================================================================== */

        function RecyGoBrandMark({ size = 44, showWordmark = true }) {
          return (
            <div className="inline-flex items-center gap-3">
              <span
                style={{
                  width: size,
                  height: size,
                  boxShadow: "0 8px 20px -4px rgba(5, 150, 105, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.35)",
                }}
                className="relative flex shrink-0 items-center justify-center rounded-2xl bg-gradient-to-br from-emerald-400 via-emerald-600 to-teal-700 text-white"
              >
                <svg width={Math.round(size * 0.66)} height={Math.round(size * 0.66)} viewBox="0 0 48 48" fill="none" aria-hidden="true">
                  <defs>
                    <linearGradient id="rgLoopTop" x1="6" y1="6" x2="40" y2="26" gradientUnits="userSpaceOnUse">
                      <stop offset="0%" stopColor="#ffffff" />
                      <stop offset="100%" stopColor="#d1fae5" />
                    </linearGradient>
                    <linearGradient id="rgLoopBot" x1="10" y1="24" x2="42" y2="42" gradientUnits="userSpaceOnUse">
                      <stop offset="0%" stopColor="#a7f3d0" />
                      <stop offset="100%" stopColor="#34d399" />
                    </linearGradient>
                  </defs>
                  {/* Busur atas sirkular + panah dinamika GO */}
                  <path
                    d="M9.5 26C8.5 16.8 15.6 9 25 9h8.5"
                    stroke="url(#rgLoopTop)"
                    strokeWidth="4.5"
                    strokeLinecap="round"
                  />
                  <path
                    d="M29 4.5L35.5 9L29 13.5"
                    stroke="#ffffff"
                    strokeWidth="4.2"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                  />
                  {/* Busur bawah sirkular */}
                  <path
                    d="M38.5 22C39.5 31.2 32.4 39 23 39h-8.5"
                    stroke="url(#rgLoopBot)"
                    strokeWidth="4.5"
                    strokeLinecap="round"
                  />
                  <path
                    d="M19 43.5L12.5 39L19 34.5"
                    stroke="#a7f3d0"
                    strokeWidth="4.2"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                  />
                  {/* Siluet Daun Geometris Modern di Inti */}
                  <path
                    d="M30.5 17.5C22.5 17.5 17.5 22 17.5 28c0 2.8 2 4.8 4.8 4.8 6.2 0 8.2-6 8.2-15.3Z"
                    fill="#ffffff"
                  />
                  <path
                    d="M17.5 31.5C21 27.2 24 24.5 28 21"
                    stroke="#047857"
                    strokeWidth="2.6"
                    strokeLinecap="round"
                  />
                </svg>
              </span>
              {showWordmark && (
                <div className="min-w-0">
                  <p className="font-brand text-xl font-extrabold leading-none tracking-tight text-slate-900">
                    Recy<span className="bg-gradient-to-r from-emerald-600 to-teal-500 bg-clip-text text-transparent">GO</span>
                  </p>
                  <p className="mt-1 text-[11px] font-medium leading-tight tracking-normal text-slate-500">
                    Smart Waste to Resource
                  </p>
                </div>
              )}
            </div>
          );
        }

        /* ---------------- Logo Khusus untuk 7 Fitur RecyGO ---------------- */

        function FeatureIcon({ id, size = 24 }) {
          switch (id) {
            case "recylearn":
              return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M2 5c4-1 7-.5 10 1.5 3-2 6-2.5 10-1.5v13c-4-1-7-.5-10 1.5-3-2-6-2.5-10-1.5V5Z" />
                  <path d="M12 6.5v13" />
                  <circle cx="18" cy="4" r="2" fill="currentColor" />
                </svg>
              );
            case "recypoin":
              return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <circle cx="12" cy="12" r="9" />
                  <circle cx="12" cy="12" r="6" strokeDasharray="2 2" />
                  <path d="M12 8v8M9.5 10.5h3.5a1.5 1.5 0 0 1 0 3h-2a1.5 1.5 0 0 0 0 3H14.5" />
                </svg>
              );
            case "recypick":

                  <path d="M14 10h4l3 3v3h-7v-6Z" />
                  <circle cx="6.5" cy="17.5" r="2" />
                  <circle cx="17.5" cy="17.5" r="2" />

                </svg>
              );
            case "recysense":

                  <path d="M5 8h14" />
                  <path d="M9 5a5 5 0 0 1 6 0" />
                  <path d="M7 2.8a8.5 8.5 0 0 1 10 0" />
                </svg>

                  <path d="M12 3L6 11h4l-2.5 6h9L14 11h4L12 3Z" />

        /* --------- Gambar Visual Setiap Produk di RecyMart (SVG) ---------- */

        function MartProductImage({ type }) {
          switch (type) {
            case "pelet":
              return (
                <svg viewBox="0 0 320 160" className="h-full w-full">
                  <defs>
                    <linearGradient id="mPelet" x1="0" y1="0" x2="1" y2="1">
                      <stop offset="0%" stopColor="#10b981" />
                      <stop offset="100%" stopColor="#0f766e" />
                    </linearGradient>
                  </defs>
                  <rect width="320" height="160" fill="url(#mPelet)" />

        function useCountUp(target, duration = 800) {
          const [val, setVal] = useState(0);
          const from = useRef(0);
          useEffect(() => {
            let raf;
            const start = performance.now();
            const startVal = from.current;
            const step = (now) => {
              const p = Math.min(1, (now - start) / duration);
              const eased = 1 - Math.pow(1 - p, 3);
              const v = Math.round(startVal + (target - startVal) * eased);
              from.current = v;
              setVal(v);
              if (p < 1) raf = requestAnimationFrame(step);
            };
            raf = requestAnimationFrame(step);
            return () => cancelAnimationFrame(raf);
          }, [target, duration]);
          return val;

        /* ---------------------------- Scan QR Setor ------------------------- */

        function FakeQR({ lit }) {
          const n = 11;
          const cells = [];
          for (let i = 0; i < n; i++) {
            for (let j = 0; j < n; j++) {
              const inFinder = (i < 3 && j < 3) || (i < 3 && j > n - 4) || (i > n - 4 && j < 3);
              if (!inFinder && (i * 5 + j * 7 + i * j) % 3 === 0) {
                cells.push(<rect key={`${i}-${j}`} x={j * 10} y={i * 10} width="8" height="8" rx="1.5" />);
              }
            }
          }
          const finder = (x, y) => (
            <g key={`${x}-${y}`}>
              <rect x={x + 2} y={y + 2} width="26" height="26" rx="5" fill="none" strokeWidth="4" />
              <rect x={x + 10} y={y + 10} width="10" height="10" rx="2" />
            </g>
          );
          const color = lit ? "#6ee7b7" : "#94a3b8";
          return (
            <svg viewBox="0 0 110 110" className="h-full w-full" fill={color} stroke={color} style={{ opacity: lit ? 0.95 : 0.4, transition: "opacity .3s" }}>
              <g stroke="none">{cells}</g>
              {finder(0, 0)}
              {finder(80, 0)}
              {finder(0, 80)}
            </svg>
          );
        }

        function ScanModal({ sites, initialSiteId, onDeposit, onClose }) {
          const [step, setStep] = useState("scan");
          const [siteIdx, setSiteIdx] = useState(Math.max(0, sites.findIndex((s) => s.id === initialSiteId)));
          const detections = useRef(0);
          const [type, setType] = useState("plastik");
          const [kg, setKg] = useState(2);
          const [result, setResult] = useState(null);

          const site = sites[siteIdx];
          const w = WASTE[type];
          const binLevel = site.bins[w.bin];
          const full = binLevel >= 100;
          const pts = Math.round(kg * w.rate);

          useEffect(() => {
            if (step !== "scanning") return undefined;
            const id = setTimeout(() => {
              if (detections.current > 0) setSiteIdx((i) => (i + 1) % sites.length);
              detections.current += 1;
              setStep("form");
            }, 1400);
            return () => clearTimeout(id);
          }, [step, sites.length]);

          const titles = { scan: "Scan QR Setor RecyGO", scanning: "Memindai QR TPS", form: "Detail Setoran Sampah", done: "Setoran Berhasil" };

          return (
            <Sheet title={titles[step]} onClose={onClose}>
              {(step === "scan" || step === "scanning") && (
                <div>
                  <p className="text-sm text-slate-500">Arahkan kamera ke kode QR pada tempat sampah komunal berteknologi RecySense.</p>
                  <div
                    className="relative mx-auto mt-4 w-full max-w-xs overflow-hidden rounded-3xl bg-slate-900"
                    style={{ aspectRatio: "1 / 1" }}
                  >
                    <div className="absolute inset-0 flex items-center justify-center p-12">
                      <FakeQR lit={step === "scanning"} />
                    </div>
                    <span className="absolute left-5 top-5 h-9 w-9 rounded-tl-2xl border-l-4 border-t-4 border-emerald-400" />
                    <span className="absolute right-5 top-5 h-9 w-9 rounded-tr-2xl border-r-4 border-t-4 border-emerald-400" />
                    <span className="absolute bottom-5 left-5 h-9 w-9 rounded-bl-2xl border-b-4 border-l-4 border-emerald-400" />
                    <span className="absolute bottom-5 right-5 h-9 w-9 rounded-br-2xl border-b-4 border-r-4 border-emerald-400" />
                    {step === "scanning" && (
                      <div className="eco-scan absolute inset-x-6 h-0.5 rounded-full bg-emerald-400" style={{ boxShadow: "0 0 18px 2px #34d399" }} />
                    )}
                  </div>
                  <p className="mt-4 text-center text-sm font-medium text-slate-700" aria-live="polite">
                    {step === "scanning" ? "Membaca kode QR..." : "Kamera siap"}
                  </p>
                  <Button className="mt-4 w-full" disabled={step === "scanning"} onClick={() => setStep("scanning")}>
                    <ScanLine size={18} />
                    {step === "scanning" ? "Memindai" : "Simulasikan scan"}
                  </Button>
                </div>
              )}

              {step === "form" && (
                <div>
                  <div className="flex items-center gap-3 rounded-2xl bg-emerald-50 p-3.5">
                    <span className="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-white text-emerald-600">
                      <BadgeCheck size={20} />
                    </span>
                    <div className="min-w-0 flex-1">
                      <p className="truncate text-sm font-semibold text-emerald-900">{site.name}</p>
                      <p className="text-xs text-emerald-700">Sensor RecySense terhubung, {site.area}</p>
                    </div>
                    <button
                      type="button"
                      onClick={() => setStep("scan")}
                      className="shrink-0 rounded-lg px-2 py-1 text-xs font-medium text-emerald-700 transition hover:bg-white"
                    >
                      Scan TPS lain
                    </button>
                  </div>

                  <FieldLabel>Jenis sampah terpilah</FieldLabel>
                  <div className="grid grid-cols-3 gap-2">
                    {Object.keys(WASTE).map((k) => {
                      const active = k === type;
                      return (
                        <button
                          key={k}
                          type="button"
                          aria-pressed={active}
                          onClick={() => setType(k)}
                          className={`rounded-xl border p-3 text-left transition active:scale-95 ${
                            active ? "border-emerald-600 bg-emerald-50" : "border-slate-200 bg-white hover:border-emerald-300"
                          }`}
                        >
                          <span className={`block text-sm font-semibold ${active ? "text-emerald-900" : "text-slate-800"}`}>{WASTE[k].label}</span>
                          <span className={`block text-xs ${active ? "text-emerald-700" : "text-slate-500"}`}>{WASTE[k].rate} poin/kg</span>
                        </button>
                      );
                    })}
                  </div>

                  <FieldLabel>Berat setoran</FieldLabel>
                  <Stepper value={kg} onChange={setKg} min={0.5} max={50} step={0.5} unit="kg" />

                  <p className={`mt-3 flex items-center gap-1.5 text-xs ${full ? "text-rose-600" : binLevel >= 80 ? "text-amber-700" : "text-slate-500"}`}>
                    <Info size={14} />
                    {full
                      ? `Wadah ${BIN_LABEL[w.bin].toLowerCase()} sudah penuh. Silakan pilih TPS lain.`
                      : `Kapasitas wadah ${BIN_LABEL[w.bin].toLowerCase()} saat ini ${binLevel}%.`}
                  </p>

                  <div className="mt-4 flex items-center justify-between rounded-2xl bg-gradient-to-br from-emerald-500 to-emerald-700 p-4 text-white">
                    <div>
                      <p className="text-xs text-emerald-100">Tambahan RecyPoin</p>
                      <p className="text-2xl font-semibold tabular-nums tracking-tight">+{fmt(pts)} poin</p>
                    </div>
                    <p className="text-xs text-emerald-100">Setara Rp {fmt(pts * POINT_VALUE)}</p>
                  </div>

                  <Button
                    className="mt-4 w-full"
                    disabled={full}
                    onClick={() => {
                      setResult(onDeposit({ siteId: site.id, type, kg }));
                      setStep("done");
                    }}
                  >
                    <Check size={18} />
                    Konfirmasi setor
                  </Button>
                </div>
              )}

              {step === "done" && result && (
                <div className="flex flex-col items-center pt-2 text-center">
                  <span className="flex h-16 w-16 items-center justify-center rounded-full bg-emerald-600 text-white" style={{ boxShadow: "0 10px 24px rgba(5,150,105,0.35)" }}>
                    <Check size={32} strokeWidth={3} />
                  </span>
                  <p className="mt-4 text-3xl font-semibold tabular-nums tracking-tight text-slate-900">+{fmt(result.pts)} poin</p>
                  <p className="mt-1 text-sm text-slate-500">
                    {result.w.label} {fmtKg(result.kg)} kg di {result.site.name}
                  </p>
                  <p className="mt-3 max-w-xs rounded-xl bg-slate-50 px-4 py-3 text-xs text-slate-500">
                    Data sensor RecySense dan kalkulator jejak karbon RecyTrack otomatis diperbarui.
                  </p>
                  <div className="mt-5 grid w-full grid-cols-2 gap-2.5">
                    <Button variant="ghost" onClick={() => setStep("form")}>Setor lagi</Button>
                    <Button onClick={onClose}>Selesai</Button>
                  </div>
                </div>
              )}

        function Dashboard({ avatarUrl, onReset }) {
          const [tab, setTab] = useState("home");

          const [treesSaved, setTreesSaved] = useState(15);
          const [carbonReduced, setCarbonReduced] = useState(5.0);
          const [weekly, setWeekly] = useState(() => [4.5, 3.2, 6.0, 2.8, 5.4, 7.1, 3.9].map((v, i) => (i < TODAY_IDX ? v : i === TODAY_IDX ? 2.5 : 0)));
          const [history, setHistory] = useState(HISTORY_SEED);
          const [sites, setSites] = useState(SITES_SEED);
          const [syncAt, setSyncAt] = useState(Date.now());
          const [pickups, setPickups] = useState([]);
          const [redeemed, setRedeemed] = useState([]);
          const [eduDone, setEduDone] = useState(["dasar"]);
          const [joinedHub, setJoinedHub] = useState(["c1"]);
          const [crowdfunds, setCrowdfunds] = useState(HUB_CROWDFUND);
          const [notifs, setNotifs] = useState(NOTIF_SEED);
          const [settings, setSettings] = useState({ alerts: true, reminders: true });
          const [requested, setRequested] = useState([]);
          const [selectedSite, setSelectedSite] = useState("mawar");
          const [modal, setModal] = useState(null);
          const [toasts, setToasts] = useState([]);

          const sitesRef = useRef(sites);
          sitesRef.current = sites;
          const settingsRef = useRef(settings);
          settingsRef.current = settings;
          const cancelledRef = useRef(new Set());

          const firstName = user.name.trim().split(" ")[0] || "fiandhikaaa";

          const showToast = (msg) => {
            const id = uid();
            setToasts((t) => [...t, { id, msg }]);
            setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3200);
          };
          const addHistory = (item) => setHistory((h) => [{ id: uid(), time: nowLabel(), status: null, ...item }, ...h]);
          const pushNotif = (title, body, kind = "info", go = null) =>
            setNotifs((n) => [{ id: uid(), kind, title, body, time: "Baru saja", read: false, go }, ...n]);

          useEffect(() => {
            window.scrollTo(0, 0);
          }, [tab]);

          useEffect(() => {
            const id = setInterval(() => {
              const list = sitesRef.current;
              const s = list[Math.floor(Math.random() * list.length)];
              const keys = Object.keys(s.bins);
              const k = keys[Math.floor(Math.random() * keys.length)];
              const cur = s.bins[k];
              if (cur < 99 && Math.random() < 0.6) {
                setSites((l) => l.map((x) => (x.id === s.id && x.bins[k] < 99 ? { ...x, bins: { ...x.bins, [k]: x.bins[k] + 1 } } : x)));
                if (cur + 1 === 80 && settingsRef.current.alerts) {
                  pushNotif(`RecySense: ${s.name} mencapai 80%`, `${BIN_LABEL[k]} telah mencapai 80%. Armada pengangkut diberi tahu.`, "alert", "recysense");
                }
              }
              setSyncAt(Date.now());
            }, 6000);
            return () => clearInterval(id);
          }, []);

          const deposit = ({ siteId, type, kg }) => {
            const w = WASTE[type];
            const pts = Math.round(kg * w.rate);
            const site = sitesRef.current.find((s) => s.id === siteId);
            const before = site.bins[w.bin];
            const after = Math.min(100, before + Math.max(1, Math.round(kg * 0.6)));
            setSites((l) => l.map((s) => (s.id === siteId ? { ...s, bins: { ...s.bins, [w.bin]: after } } : s)));
            setSyncAt(Date.now());
            setPoints((p) => p + pts);
            setTotalEarned((t) => t + pts);
            setTotalKg((t) => t + kg);
            setMonthKg((m) => m + kg);
            setCarbonReduced((c) => +(c + kg * 0.4).toFixed(1));
            setWeekly((arr) => arr.map((v, i) => (i === TODAY_IDX ? +(v + kg).toFixed(1) : v)));
            addHistory({ type: "setor", title: `Setor ${w.label} ${fmtKg(kg)} kg`, sub: site.name, points: pts });
            if (after >= 80 && before < 80 && settingsRef.current.alerts) {
              pushNotif(`RecySense: ${site.name} mencapai ${after}%`, `Wadah ${BIN_LABEL[w.bin]} melewati ambang 80%.`, "alert", "recysense");
            }
            showToast(`+${fmt(pts)} RecyPoin masuk ke saldo`);
            return { pts, site, w, kg };
          };

          const schedulePickup = ({ types, kg, destType, dateLabel, slot, address, autoMode }) => {
            const id = uid();
            const label = types.map((t) => WASTE[t].label).join(", ");
            const statusLabel = autoMode ? "Otomatis Berkala" : "Dijadwalkan";
            setPickups((p) => [...p, { id, label, kg, destType, dateLabel, slot, address, status: statusLabel }]);
            setHistory((h) => [
              { id, type: "jemput", title: `RecyPick (${destType}): ${label} ${fmtKg(kg)} kg`, sub: `${dateLabel}, ${slot}`, time: nowLabel(), points: 0, status: statusLabel },
              ...h,
            ]);
            pushNotif("Armada RecyPick dijadwalkan", `${destType} — ${dateLabel}, ${slot}.`, "info", "home");
            setModal(null);
            showToast("Penjemputan RecyPick berhasil dijadwalkan");

            setTimeout(() => {
              if (cancelledRef.current.has(id)) return;
              setPickups((p) => p.map((x) => (x.id === id ? { ...x, status: "Dikonfirmasi" } : x)));
              setHistory((h) => h.map((x) => (x.id === id ? { ...x, status: "Dikonfirmasi" } : x)));
              if (settingsRef.current.reminders) {
                pushNotif("Armada RecyPick dikonfirmasi", `Petugas menuju ${destType} pada jadwal ${slot}.`, "ok", "home");
                showToast("Armada RecyPick mengonfirmasi jadwal jemput");
              }
            }, 5000);
          };

          const cancelPickup = (id) => {
            cancelledRef.current.add(id);
            setPickups((p) => p.filter((x) => x.id !== id));
            setHistory((h) => h.map((x) => (x.id === id ? { ...x, status: "Dibatalkan" } : x)));
            showToast("Jadwal RecyPick dibatalkan");
          };

          const redeem = (reward) => {
            const code = `RGO-${rand4()}-${rand4()}`;
            setPoints((p) => p - reward.cost);
            setRedeemed((r) => [{ id: uid(), rewardId: reward.id, title: reward.title, code }, ...r]);
            addHistory({ type: "tukar", title: `Tukar ${reward.title}`, sub: `Kode ${code}`, points: -reward.cost });
            return code;
          };

          const copyCode = async (code) => {
            try {
              await navigator.clipboard.writeText(code);
              showToast("Kode disalin");
            } catch (e) {
              showToast(`Salin manual: ${code}`);
            }
          };

          const completeEdu = (mod) => {
            if (eduDone.includes(mod.id)) return;
            setEduDone((d) => [...d, mod.id]);
            setPoints((p) => p + mod.pts);
            setTotalEarned((t) => t + mod.pts);
            addHistory({ type: "edu", title: `Selesai modul ${mod.title}`, sub: "RecyLearn", points: mod.pts });
            showToast(`+${mod.pts} RecyPoin dari modul RecyLearn`);
          };

          const requestEmpty = (site) => {
            setRequested((r) => [...r, site.id]);
            pushNotif("Notifikasi 80% RecySense dikirim", `Armada RecyPick menuju ${site.name} melalui rute efisien.`, "info", "recysense");
            showToast("Armada pengangkut diberangkatkan ke TPS");
            setTimeout(() => {
              setSites((l) => l.map((s) => (s.id === site.id ? { ...s, bins: { organik: 8, anorganik: 10, ewaste: 6 } } : s)));
              setRequested((r) => r.filter((x) => x !== site.id));
              setSyncAt(Date.now());
              pushNotif(`${site.name} telah dikosongkan`, "Sensor RecySense membaca kapasitas kembali normal.", "ok", "recysense");
              showToast(`${site.name} telah dikosongkan`);
            }, 7000);
          };

          const confirmB2B = (product, orderKg, buyerName) => {
            addHistory({
              type: "setor",
              title: `Kontrak B2B RecyMart: ${product.title} (${orderKg} kg)`,
              sub: `${buyerName} • ${product.seller}`,
              points: 150,
            });
            setPoints((p) => p + 150);
            showToast(`Pesanan B2B ${orderKg} kg berhasil diajukan (+150 RecyPoin)`);
          };

          const addCarbonRecord = (trees, co2) => {
            setTreesSaved((t) => t + trees);
            setCarbonReduced((c) => +(c + co2).toFixed(1));
            showToast(`RecyTrack diperbarui: +${trees} pohon & -${fmtKg(co2)} kg emisi CO2`);
          };

          const toggleHubCampaign = (cam) => {
            if (joinedHub.includes(cam.id)) {
              setJoinedHub((l) => l.filter((x) => x !== cam.id));
              showToast("Pendaftaran relawan dibatalkan");
            } else {
              setJoinedHub((l) => [...l, cam.id]);
              setPoints((p) => p + cam.pts);
              addHistory({ type: "edu", title: `Relawan RecyHub: ${cam.title}`, sub: cam.area, points: cam.pts });
              showToast(`Terdaftar sebagai relawan (+${cam.pts} RecyPoin)`);
            }
          };

          const donateHub = (cf) => {
            if (points < 200) {
              showToast("Saldo RecyPoin belum cukup untuk donasi 200 poin");
              return;
            }
            setPoints((p) => p - 200);
            setCrowdfunds((list) =>
              list.map((item) => (item.id === cf.id ? { ...item, raised: item.raised + 20000, donors: item.donors + 1 } : item))
            );
            addHistory({ type: "tukar", title: `Crowdfunding RecyHub: ${cf.title}`, sub: "Donasi 200 RecyPoin", points: -200 });
            showToast("Donasi crowdfunding TPS desa berhasil dikirim");
          };

          const openPickup = (types = []) => setModal({ kind: "pickup", types });
          const openScan = (siteId) => setModal({ kind: "scan", siteId: siteId || "mawar" });
          const closeModal = () => setModal(null);

          const run = (id) => {
            if (id === "recypick" || id === "pickup") openPickup();
            else if (id === "scan") openScan("mawar");
            else setTab(id);
          };

          const unread = notifs.filter((n) => !n.read).length;
          const goNotif = (n) => {
            setNotifs((list) => list.map((x) => (x.id === n.id ? { ...x, read: true } : x)));
            setModal(null);
            if (n.go === "pickup") openPickup(["organik"]);
            else if (n.go) setTab(n.go);
          };

          const c = {
            user, firstName, avatarUrl, points, totalEarned, totalKg, monthKg, treesSaved, carbonReduced,
            weekly, history, sites, syncAt, pickups, redeemed, eduDone, joinedHub, crowdfunds,
            settings, requested, selectedSite,
            setTab, setSelectedSite, setSettings, setUser,
            openPickup, openScan, run, requestEmpty, cancelPickup, showToast, onReset,
            addCarbonRecord, toggleHubCampaign, donateHub,
            openReward: (reward) => setModal({ kind: "reward", reward }),
            openEdu: (mod) => setModal({ kind: "edu", id: mod.id }),
            openB2B: (product) => setModal({ kind: "b2b", product }),
          };

          const page =
            tab === "home" ? <HomePage c={c} /> :
            tab === "recysense" ? <MapPage c={c} /> :
            tab === "recymart" ? <RecyMartPage c={c} /> :
            tab === "recytrack" ? <RecyTrackPage c={c} /> :
            tab === "recyhub" ? <RecyHubPage c={c} /> :
            tab === "history" ? <HistoryPage c={c} /> :
            tab === "profile" ? <ProfilePage c={c} /> :
            tab === "recypoin" ? <RewardsPage c={c} /> :
            <EduPage c={c} />;

          const eduMod = modal && modal.kind === "edu" ? EDU_MODULES.find((m) => m.id === modal.id) : null;

          return (
            <div className="min-h-screen bg-white text-slate-900 lg:bg-slate-50">
              <style>{GLOBAL_CSS}</style>

              <Sidebar tab={tab} user={user} avatarUrl={avatarUrl} totalEarned={totalEarned} onTab={setTab} onRun={run} />

              <div className="lg:pl-64">
                <div className="mx-auto w-full max-w-xl px-5 pb-32 lg:max-w-6xl lg:px-10 lg:pb-14">
                  <Header
                    tab={tab}
                    firstName={firstName}
                    name={user.name}
                    avatarUrl={avatarUrl}
                    unread={unread}
                    onBell={() => setModal({ kind: "notif" })}
                    onHistory={() => setTab("history")}
                    onProfile={() => setTab("profile")}
                    onBack={() => setTab("home")}
                  />
                  <main className="mt-6 lg:mt-8">{page}</main>
                </div>
              </div>

              <BottomNav tab={tab} onTab={setTab} />

              {modal && modal.kind === "pickup" && (
                <PickupModal initialTypes={modal.types} address={user.address} onSubmit={schedulePickup} onClose={closeModal} />
              )}
              {modal && modal.kind === "scan" && (
                <ScanModal sites={sites} initialSiteId={modal.siteId} onDeposit={deposit} onClose={closeModal} />
              )}
              {modal && modal.kind === "reward" && (
                <RewardModal reward={modal.reward} points={points} onConfirm={redeem} onCopy={copyCode} onClose={closeModal} />
              )}
              {modal && modal.kind === "b2b" && (
                <B2BModal product={modal.product} onConfirm={confirmB2B} onClose={closeModal} />
              )}
              {eduMod && <EduModal mod={eduMod} done={eduDone.includes(eduMod.id)} onComplete={completeEdu} onClose={closeModal} />}
              {modal && modal.kind === "notif" && (
                <NotifSheet
                  notifs={notifs}
                  onReadAll={() => setNotifs((l) => l.map((n) => ({ ...n, read: true })))}
                  onGo={goNotif}
                  onClose={closeModal}
                />
              )}

              <Toasts items={toasts} />
            </div>
          );
        }

        function RecyGoDashboard({ avatarUrl = null }) {
          const [run, setRun] = useState(0);
          return <Dashboard key={run} avatarUrl={avatarUrl} onReset={() => setRun((r) => r + 1)} />;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<RecyGoDashboard />);
    </script>
</body>
</html>
